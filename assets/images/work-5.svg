<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="30%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#uiBg)" />
  <!-- Smartphone Frame Center -->
  <rect x="220" y="40" width="160" height="260" rx="24" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
  <!-- Notch -->
  <rect x="270" y="48" width="60" height="10" rx="5" fill="#334155" />
  <!-- UI Elements inside screen -->
  <!-- Header Balance Card -->
  <rect x="235" y="70" width="130" height="60" rx="10" fill="#0284c7" />
  <circle cx="255" cy="85" r="8" fill="#fbbf24" />
  <rect x="270" y="80" width="70" height="8" rx="4" fill="#ffffff" opacity="0.8"/>
  <rect x="250" y="102" width="90" height="14" rx="4" fill="#ffffff" />
  
  <!-- Mini Action Buttons -->
  <circle cx="255" cy="155" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="300" cy="155" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="345" cy="155" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Transaction Cards -->
  <rect x="235" y="185" width="130" height="30" rx="8" fill="#1e293b" />
  <circle cx="250" cy="200" r="6" fill="#38bdf8" />
  <rect x="265" y="196" width="60" height="8" rx="3" fill="#ffffff" opacity="0.7"/>

  <rect x="235" y="225" width="130" height="30" rx="8" fill="#1e293b" />
  <circle cx="250" cy="240" r="6" fill="#fbbf24" />
  <rect x="265" y="236" width="50" height="8" rx="3" fill="#ffffff" opacity="0.7"/>

  <!-- Secondary Phone Peek Background Left -->
  <rect x="110" y="80" width="90" height="180" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Secondary Phone Peek Background Right -->
  <rect x="400" y="80" width="90" height="180" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>

  <text x="300" y="335" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" text-anchor="middle">FINWAVE MOBILE APP</text>
  <text x="300" y="362" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">FINTECH UI/UX &amp; DESIGN SYSTEM</text>
</svg>
