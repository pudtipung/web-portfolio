<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="250" r="230" fill="url(#avatarBg)" opacity="0.15" />
  <circle cx="250" cy="250" r="200" fill="url(#avatarBg)" filter="url(#softGlow)" />
  <circle cx="250" cy="250" r="190" fill="#0f172a" opacity="0.85" />

  <!-- Abstract Creative Shapes in Back -->
  <rect x="70" y="80" width="60" height="60" rx="16" fill="#38bdf8" opacity="0.3" transform="rotate(25 100 110)" />
  <circle cx="410" cy="140" r="24" fill="#fbbf24" opacity="0.4" />
  <polygon points="400,380 430,420 370,420" fill="#38bdf8" opacity="0.4" />

  <!-- Stylized Character Silhouette/Avatar -->
  <g id="character">
    <!-- Shoulders / Torso -->
    <path d="M 140 440 C 140 350, 180 320, 250 320 C 320 320, 360 350, 360 440 Z" fill="url(#avatarBg)" />
    <!-- Collar / Hoodie V -->
    <path d="M 215 320 L 250 375 L 285 320 Z" fill="#1e293b" />
    <!-- Neck -->
    <rect x="225" y="260" width="50" height="70" rx="10" fill="#fdba74" />
    <!-- Head Base -->
    <ellipse cx="250" cy="210" rx="65" ry="75" fill="#fcd34d" />
    
    <!-- Modern Haircut -->
    <path d="M 180 200 C 175 140, 210 115, 260 115 C 315 115, 335 150, 325 195 C 315 170, 280 160, 240 165 C 205 170, 190 185, 180 200 Z" fill="#0369a1" />
    <!-- Creative Designer Glasses (Sky Blue + Amber Yellow) -->
    <rect x="195" y="195" width="45" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <rect x="260" y="195" width="45" height="30" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <line x1="240" y1="210" x2="260" y2="210" stroke="#38bdf8" stroke-width="4" />
    <!-- Glasses Reflection -->
    <path d="M 200 202 L 215 202 L 205 218 L 198 218 Z" fill="#ffffff" opacity="0.6"/>
    <path d="M 265 202 L 280 202 L 270 218 L 263 218 Z" fill="#ffffff" opacity="0.6"/>

    <!-- Friendly Smile -->
    <path d="M 235 250 Q 250 262 265 250" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Headphones around neck -->
    <path d="M 180 280 C 180 340, 320 340, 320 280" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
    <rect x="170" y="270" width="20" height="36" rx="8" fill="#38bdf8" />
    <rect x="310" y="270" width="20" height="36" rx="8" fill="#38bdf8" />
  </g>

  <!-- Creative Media Floating Badges -->
  <g transform="translate(60, 280)">
    <rect width="70" height="32" rx="16" fill="#0284c7" />
    <text x="35" y="20" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">CREATIVE</text>
  </g>

  <g transform="translate(360, 230)">
    <rect width="65" height="32" rx="16" fill="#f59e0b" />
    <text x="32" y="20" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">MEDIA</text>
  </g>

  <!-- Outer Ring Detail -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="16 12" />
</svg>
