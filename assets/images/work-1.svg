<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)" />
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="50" x2="600" y2="50" /><line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="250" x2="600" y2="250" /><line x1="0" y1="350" x2="600" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" /><line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" /><line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
  </g>
  <!-- Card Mockup -->
  <rect x="120" y="80" width="360" height="240" rx="20" fill="#0f172a" opacity="0.85" filter="url(#shadow1)"/>
  <!-- Geometric Logo Icon in Center -->
  <polygon points="300,120 360,220 240,220" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="300" cy="180" r="28" fill="#38bdf8" />
  <circle cx="300" cy="180" r="14" fill="#0f172a" />
  <!-- Typography / Brand Elements -->
  <text x="300" y="260" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" text-anchor="middle" letter-spacing="4">AURORA BRANDING</text>
  <text x="300" y="285" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">VISUAL IDENTITY &amp; PACKAGING</text>
  <!-- Floating Color Palette Dots -->
  <circle cx="160" cy="115" r="8" fill="#38bdf8" />
  <circle cx="185" cy="115" r="8" fill="#fbbf24" />
  <circle cx="210" cy="115" r="8" fill="#ffffff" />
  <rect x="400" y="107" width="55" height="18" rx="9" fill="#0284c7" />
  <text x="427" y="120" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">GRAPHIC</text>
</svg>
