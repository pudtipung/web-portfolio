<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#photoGrad)" />
  <!-- Rule of thirds grid lines -->
  <line x1="200" y1="0" x2="200" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="400" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  <line x1="0" y1="133" x2="600" y2="133" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  <line x1="0" y1="266" x2="600" y2="266" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  
  <!-- Camera Lens Graphic -->
  <circle cx="300" cy="190" r="110" fill="url(#apertureGlow)" />
  <circle cx="300" cy="190" r="95" fill="#0b0f19" stroke="#f59e0b" stroke-width="6" />
  <circle cx="300" cy="190" r="75" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <circle cx="300" cy="190" r="50" fill="#0284c7" opacity="0.5" />
  <circle cx="280" cy="170" r="16" fill="#ffffff" opacity="0.4" />
  
  <!-- Camera HUD Crosshairs -->
  <path d="M 270 190 L 260 190 M 330 190 L 340 190 M 300 160 L 300 150 M 300 220 L 300 230" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Title / Tag -->
  <text x="300" y="340" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" text-anchor="middle">URBAN PERSPECTIVES</text>
  <text x="300" y="365" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">STREET &amp; ARCHITECTURAL PHOTOGRAPHY</text>
</svg>
